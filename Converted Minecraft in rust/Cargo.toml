# Generated by _porting/tools/mirror.py -- one crate, mirrored layout.
[package]
name = "minecraft_rust"
version = "0.1.0"
edition = "2021"
publish = false
description = "Bit-exact Rust translation of Minecraft 26.2 (Fabric split client jar)"

[lib]
name = "minecraft_rust"
path = "lib.rs"

# Parity tests against the Java oracle golden data (see _porting/java-oracle).
# Paths are relative to the crate root, i.e. "Converted Minecraft in rust/".
#
# NOTE: this file is regenerated on every mirror.py run, so a new parity test must be
# added HERE, not by editing Cargo.toml directly. Adding it only to Cargo.toml works
# right up until the next `mirror.py` run silently drops it -- and the failure mode is
# "no test target named parity_X", which reads like a typo rather than a lost entry.
[[test]]
name = "parity_mth"
path = "_porting/tests/parity_mth.rs"

[[test]]
name = "parity_core"
path = "_porting/tests/parity_core.rs"

[[test]]
name = "parity_random"
path = "_porting/tests/parity_random.rs"

[[test]]
name = "parity_batch2"
path = "_porting/tests/parity_batch2.rs"

[[test]]
name = "parity_jvm_math"
path = "_porting/tests/parity_jvm_math.rs"

# Runtime dependencies. Currently EMPTY on purpose, and that is worth keeping that way.
#
# Session 08 measured musl's `log` (the `libm` crate) against FdLibm's as a candidate for
# `Math.log`, FdLibm won on both corpora, and the dependency was removed again rather than
# shipped unused. The numbers are in `_porting/javacompat/jvm_math.rs`.
#
# If you `cargo add` something, add it HERE TOO. `cargo add` writes only to Cargo.toml, and the
# next `mirror.py` run rewrites that file from this template -- so a dependency added that way
# disappears without warning, and `mirror.py --check` reports it as DRIFT. (Exactly what happened
# with `libm` in session 08, and with the `parity_jvm_math` test target in session 07.)
[dependencies]

[profile.dev]
# 7055 mirrored modules: keep debug info out of the way.
debug = 0
